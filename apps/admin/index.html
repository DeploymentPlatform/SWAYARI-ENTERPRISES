<!DOCTYPE html>
<html lang="en-IN">

    <meta name="theme-color" content="#4A1428" />
    <meta name="color-scheme" content="light" />
    <title>SWAYARI — Staff Portal</title>
    <!-- Internal staff portal: never indexed -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/brand/favicon-48.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <!-- Self-hosted fonts (see packages/ui/src/fonts.css): preload the faces used above the fold -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/cinzel-normal-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-normal-latin.woff2" crossorigin />

    <script src="https://accounts.google.com/gsi/client" async defer></script>

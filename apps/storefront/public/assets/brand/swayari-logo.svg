<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="swayariGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596"/>
      <stop offset="30%" stop-color="#C5A059"/>
      <stop offset="60%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#9E782F"/>
    </linearGradient>
    <linearGradient id="swayariGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA822A"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Wordmark: SWAYARI -->
  <text x="300" y="80" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Cormorant Garamond', 'Playfair Display', 'Times New Roman', serif" 
        font-size="68" 
        font-weight="700" 
        letter-spacing="9" 
        fill="url(#swayariGold)"
        filter="url(#subtleGlow)">
    SWAYARI
  </text>

  <!-- Subtitle: DÉCOR & GIFTING -->
  <text x="300" y="112" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="14.5" 
        font-weight="500" 
        letter-spacing="9.5" 
        fill="url(#swayariGoldLight)">
    DÉCOR &amp; GIFTING
  </text>

  <!-- Lotus Crest & Ornamentation -->
  <!-- Left rule -->
  <line x1="120" y1="134" x2="270" y2="134" stroke="url(#swayariGold)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="120" cy="134" r="2" fill="url(#swayariGold)"/>

  <!-- Center Lotus Emblem -->
  <g transform="translate(300, 134) scale(0.65)" stroke="url(#swayariGold)" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Center petal -->
    <path d="M0 -22 C-4 -12 -5 -4 0 4 C5 -4 4 -12 0 -22 Z" fill="url(#swayariGold)" fill-opacity="0.3"/>
    <!-- Left inner petal -->
    <path d="M-4 -2 C-14 -12 -18 2 -3 5" fill="none"/>
    <!-- Right inner petal -->
    <path d="M4 -2 C14 -12 18 2 3 5" fill="none"/>
    <!-- Left outer petal -->
    <path d="M-7 2 C-22 -4 -24 9 -5 8" fill="none"/>
    <!-- Right outer petal -->
    <path d="M7 2 C22 -4 24 9 5 8" fill="none"/>
    <!-- Bottom diamond accent -->
    <polygon points="0,11 3,15 0,19 -3,15" fill="url(#swayariGold)"/>
  </g>

  <!-- Right rule -->
  <line x1="330" y1="134" x2="480" y2="134" stroke="url(#swayariGold)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="480" cy="134" r="2" fill="url(#swayariGold)"/>
</svg>

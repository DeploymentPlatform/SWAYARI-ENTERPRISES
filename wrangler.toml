name = "swayari-enterprises"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "swayari-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
ADMIN_EMAILS = "swayarienterprises@gmail.com"
# GOOGLE_CLIENT_ID and SESSION_SECRET should be set via Cloudflare Pages secrets:
# wrangler pages secret put GOOGLE_CLIENT_ID
# wrangler pages secret put SESSION_SECRET

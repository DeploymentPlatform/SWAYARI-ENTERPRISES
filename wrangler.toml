# Shared D1 configuration used for migrations (`npm run d1:migrate:*`).
#
# This file intentionally has NO `pages_build_output_dir`. The two portals are deployed as two
# separate Cloudflare Pages projects whose Root directory is `apps/storefront` and `apps/admin`
# respectively (see docs/BROWSER_SETUP_HANDOFF.md). A root-level Pages config here would make
# Cloudflare deploy the repository root instead, which is not a valid portal.
name = "swayari-enterprises"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "swayari-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
ADMIN_EMAILS = "swayarienterprises@gmail.com"
# GOOGLE_STOREFRONT_CLIENT_ID / GOOGLE_ADMIN_CLIENT_ID and SESSION_SECRET are set per Pages
# project in the Cloudflare dashboard (never committed).
